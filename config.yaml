# =============================================================================
# Elysium-Bench v0.4.1 — 10 Categories × 10 Tasks = 100 Total
# =============================================================================

benchmark:
  name: "Elysium-Bench"
  version: "0.4.1"
  description: >
    100-task multi-domain benchmark. Measures Elysium Swarmloop self-improvement
    across code, data, math, logic, security, review, docs, planning, and devops.

# ─── 10 Task Categories ─────────────────────────────────────────────────────
categories:
  - id: api_development
    name: "API Development"
    description: "Implement REST API endpoints from specifications"
    weight: 1.0
    task_count: 10
  - id: bug_fixing
    name: "Bug Fixing"
    description: "Fix bugs in existing codebases with test-driven verification"
    weight: 1.0
    task_count: 10
  - id: algorithm_implementation
    name: "Algorithm Implementation"
    description: "Implement algorithms from descriptions with performance constraints"
    weight: 1.0
    task_count: 10
  - id: data_analysis
    name: "Data Analysis"
    description: "SQL queries, data transformation, pandas operations, reporting"
    weight: 1.0
    task_count: 10
  - id: mathematical_reasoning
    name: "Mathematical Reasoning"
    description: "Math problems, proofs, numerical computation, optimization"
    weight: 1.0
    task_count: 10
  - id: logical_deduction
    name: "Logical Deduction"
    description: "Logic puzzles, syllogisms, constraint satisfaction, riddles"
    weight: 1.0
    task_count: 10
  - id: security_analysis
    name: "Security Analysis"
    description: "Vulnerability detection, secure code review, threat modeling"
    weight: 1.0
    task_count: 10
  - id: code_review
    name: "Code Review"
    description: "Find bugs, suggest improvements, evaluate code quality"
    weight: 1.0
    task_count: 10
  - id: documentation_generation
    name: "Documentation Generation"
    description: "Write READMEs, API docs, code comments, user guides"
    weight: 1.0
    task_count: 10
  - id: configuration_management
    name: "Configuration & DevOps"
    description: "Dockerfiles, CI/CD configs, infrastructure-as-code, env setup"
    weight: 1.0
    task_count: 10

# ─── Multi-Phase Flow ────────────────────────────────────────────────────────
phases:
  baseline:
    enabled: true
    description: "Run ALL 100 tasks WITHOUT Hermes → bare execution baseline"
    use_elysium: false

  loops:
    count: 10
    loop_1_tasks:
      api_development: [1]
      bug_fixing: [1]
      algorithm_implementation: [1]
      data_analysis: [1]
      mathematical_reasoning: [1]
      logical_deduction: [1]
      security_analysis: [1]
      code_review: [1]
      documentation_generation: [1]
      configuration_management: [1]
    practice_tasks_start: 2

  retest:
    enabled: true

# ─── Scoring Weights (0–100) ────────────────────────────────────────────────
scoring:
  correctness:    { weight: 40, description: "Is the answer/solution correct?" }
  completeness:   { weight: 25, description: "Are all parts/requirements addressed?" }
  efficiency:     { weight: 15, description: "Is it optimal, concise, well-performing?" }
  robustness:     { weight: 10, description: "Edge cases, error handling, validation" }
  clarity:        { weight: 10, description: "Well-structured, readable, properly formatted" }

# ─── Thresholds ───────────────────────────────────────────────────────────────
thresholds:
  pass: 60
  excellent: 85
  learning_min: 5

# ─── Environment ──────────────────────────────────────────────────────────────
environment:
  mode: "venv"
  python_version: "3.10"
  cleanup: true
  timeout_per_task: 600
  temp_dir: null

# ─── Hermes Agent ────────────────────────────────────────────────────────────
# The benchmark sends tasks to `hermes run --skill elysium-swarmloop`.
# Hermes Agent uses its OWN provider/model config (set via hermes config
# or ~/.hermes/config.yaml). The benchmark does NOT call LLMs directly.
#
# Make sure Hermes Agent is configured with an LLM provider before running.
# Example: hermes config set provider openrouter model deepseek/deepseek-v4-flash
# ──────────────────────────────────────────────────────────────────────────────
hermes:
  skill: "elysium-swarmloop"
  subagents_max: 100
  quality_threshold: 8
  retries_max: 5
  streaming: true
  self_learning: true
  orchestrator_depth: 2

# ─── Reporting ────────────────────────────────────────────────────────────────
reporting:
  output_dir: "./results"
  formats:
    - json
    - markdown
    - html
  verbose: false
