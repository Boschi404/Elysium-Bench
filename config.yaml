# =============================================================================
# Elysium-Bench Configuration
# =============================================================================

benchmark:
  name: "Elysium-Bench"
  version: "0.1.0"
  description: "Measures multi-agent self-improvement: runs similar tasks sequentially, re-runs the first, and computes the learning delta."

# ─── Task Categories ──────────────────────────────────────────────────────────
categories:
  - id: api_development
    name: "API Development"
    description: "Implement REST API endpoints from specifications"
    weight: 1.0
    task_count: 10

  - id: bug_fixing
    name: "Bug Fixing"
    description: "Fix bugs in existing codebases with test-driven verification"
    weight: 1.0
    task_count: 10

  - id: algorithm_implementation
    name: "Algorithm Implementation"
    description: "Implement algorithms from descriptions with performance constraints"
    weight: 1.0
    task_count: 10

# ─── Scoring Weights (0–100 total) ──────────────────────────────────────────
scoring:
  functional_correctness:
    weight: 40
    description: "All fail→pass tests pass, no pass→pass regressions"
  code_quality:
    weight: 25
    description: "Linting (ruff), type hints, docstrings, no stubs/TODOs"
  efficiency:
    weight: 15
    description: "Algorithmic complexity, resource usage, runtime"
  robustness:
    weight: 10
    description: "Edge cases, error handling, input validation"
  integration:
    weight: 10
    description: "Imports work, interface contracts match, no orphan code"

# ─── Improvement Loop ─────────────────────────────────────────────────────────
improvement_loop:
  enabled: true
  description: >
    Run tasks 1→N sequentially, then re-run task 1.
    Compare score_task_1_rerun vs score_task_1_first to measure learning.
  tasks:
    first: 1       # Task to use as baseline
    sequence: 10   # How many tasks in the sequence
    re_run: true   # Re-run first task after sequence

# ─── Thresholds ───────────────────────────────────────────────────────────────
thresholds:
  pass: 60           # Minimum total score to consider "passing"
  excellent: 85      # Excellent performance threshold
  learning_min: 5    # Minimum % improvement to claim "learning detected"

# ─── Environment ──────────────────────────────────────────────────────────────
environment:
  mode: "venv"              # venv | docker (docker recommended for clean runs)
  python_version: "3.10"
  cleanup: true             # Auto-cleanup temp files after run
  timeout_per_task: 600     # Max seconds per task
  temp_dir: null            # null = auto-create in system temp

# ─── Hermes Agent Integration ────────────────────────────────────────────────
hermes:
  skill: "elysium-swarmloop"  # Skill to load for each task
  subagents_max: 50           # Max subagents per task
  quality_threshold: 7        # Quality gate threshold (out of 10)
  retries_max: 3              # Max retries per subagent task

# ─── Reporting ────────────────────────────────────────────────────────────────
reporting:
  output_dir: "./results"
  formats:
    - json
    - markdown
    - html
  include_charts: true
  verbose: false
