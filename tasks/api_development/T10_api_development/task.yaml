id: "T10_api_development"
category: "api_development"
name: "Create Event Booking System API"
description: >
  Implement an event booking API. Must include: POST /events (create event: name, date, capacity, price), GET /events (list with ?date_from=&date_to=&available=true), GET /events/{id}, POST /events/{id}/book (book tickets: user_email, quantity), GET /bookings/{id} (booking details), DELETE /bookings/{id} (cancel booking). Use FastAPI. Validate: capacity not exceeded, date not in past, quantity > 0. Return available_seats in event response. Enforce idempotency for bookings.
difficulty: 6
tags:
  - python
  - fastapi
timeout_seconds: 600
expected_files:
  - main.py
