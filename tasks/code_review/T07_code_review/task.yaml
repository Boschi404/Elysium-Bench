id: "T07_code_review"
category: "code_review"
name: "Review: Test Coverage Analysis"
task_type: "text"
description: >
  Given a Python module with 70% test coverage, identify: 1) Untested code paths, 2) Missing edge cases (null, empty, boundary), 3) Missing integration tests, 4) Over-mocked tests. Write 5 additional test cases that would catch real bugs. Prioritize by risk.
difficulty: 5
tags:
  - code-review
timeout_seconds: 600
