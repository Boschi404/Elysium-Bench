id: "T10_code_review"
category: "code_review"
name: "Full PR Review Simulation"
task_type: "text"
description: >
  Perform a complete code review of a 200-line PR that adds a new feature module. Provide: 1) Summary of changes, 2) Line-by-line comments (praise + concerns), 3) Architecture feedback, 4) Test coverage gaps, 5) Security concerns, 6) Performance implications, 7) Approval decision (approve/request changes/reject) with justification.
