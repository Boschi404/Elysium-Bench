name: "Fix Concurrent File Write Corruption"
task_type: "code"
description: >
  Given a file-based data store where concurrent writes from POST /save can corrupt the data file because multiple processes write to the same file without locking. Fix by implementing file-level locking (using fcntl/msvcrt or a lock file). Ensure data integrity under concurrent access.
