description: >
  Build a complete data pipeline: 1) Load 3 CSV files (sales, inventory, customers), 2) Clean and validate each, 3) Join all three, 4) Compute KPIs: revenue, margin, stock turnover, customer lifetime value, 5) Aggregate by month and category, 6) Export as a single clean CSV with column descriptions. Handle all edge cases (missing files, empty data, type mismatches).
