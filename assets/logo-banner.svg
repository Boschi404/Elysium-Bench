<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bBgGlow" cx="22%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="45%" stop-color="#060d1a"/>
      <stop offset="100%" stop-color="#02050a"/>
    </radialGradient>

    <linearGradient id="bPanelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>

    <linearGradient id="bPanelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7af0ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#4de8ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4d9fff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="bCyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="bPurpleArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="bWordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="bCoreGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#e6faff"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="65%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>

    <radialGradient id="bNodeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>

    <radialGradient id="bNodeGrad2" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <filter id="bSoftBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bStrongBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="bTinyBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <clipPath id="bPanelClip">
      <rect x="6" y="6" width="788" height="188" rx="34"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="200" rx="38" fill="url(#bBgGlow)"/>

  <g clip-path="url(#bPanelClip)">
    <!-- ambient color blooms -->
    <circle cx="90" cy="170" r="110" fill="#3b82f6" opacity="0.16" filter="url(#bStrongBlur)"/>
    <circle cx="130" cy="20" r="100" fill="#22d3ee" opacity="0.20" filter="url(#bStrongBlur)"/>
    <circle cx="720" cy="170" r="140" fill="#a78bfa" opacity="0.10" filter="url(#bStrongBlur)"/>

    <!-- decorative data/benchmark mesh on the right — bar chart style -->
    <g stroke="url(#bCyanArc)" stroke-width="1.2" opacity="0.18">
      <line x1="530" y1="155" x2="530" y2="65"/>
      <line x1="560" y1="155" x2="560" y2="45"/>
      <line x1="590" y1="155" x2="590" y2="75"/>
      <line x1="620" y1="155" x2="620" y2="35"/>
      <line x1="650" y1="155" x2="650" y2="55"/>
      <line x1="680" y1="155" x2="680" y2="85"/>
      <line x1="710" y1="155" x2="710" y2="48"/>
      <line x1="530" y1="155" x2="720" y2="155"/>
    </g>
    <!-- bar tops (glowing dots) -->
    <g fill="url(#bNodeGrad)" opacity="0.5">
      <circle cx="530" cy="65" r="2.5"/>
      <circle cx="560" cy="45" r="3"/>
      <circle cx="590" cy="75" r="2.5"/>
      <circle cx="620" cy="35" r="3.2"/>
      <circle cx="650" cy="55" r="2.8"/>
      <circle cx="680" cy="85" r="2.5"/>
      <circle cx="710" cy="48" r="2.8"/>
    </g>

    <!-- ===== icon, scaled from the 240x240 icon artwork ===== -->
    <g transform="translate(26,20) scale(0.65)">
      <g stroke-linecap="round" opacity="0.55">
        <line x1="120" y1="120" x2="120" y2="43" stroke="url(#bCyanArc)" stroke-width="2"/>
        <line x1="120" y1="120" x2="187" y2="81" stroke="url(#bCyanArc)" stroke-width="2"/>
        <line x1="120" y1="120" x2="187" y2="159" stroke="url(#bPurpleArc)" stroke-width="2"/>
        <line x1="120" y1="120" x2="120" y2="197" stroke="url(#bPurpleArc)" stroke-width="2"/>
        <line x1="120" y1="120" x2="53" y2="159" stroke="url(#bPurpleArc)" stroke-width="2"/>
        <line x1="120" y1="120" x2="53" y2="81" stroke="url(#bCyanArc)" stroke-width="2"/>
      </g>

      <path d="M 120 36 A 84 84 0 1 1 38 85" fill="none" stroke="url(#bCyanArc)" stroke-width="5.5" stroke-linecap="round" opacity="0.95"/>
      <path d="M 28 68 L 38 85 L 55 78" fill="none" stroke="url(#bCyanArc)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <g>
        <circle cx="120" cy="43" r="10.5" fill="url(#bNodeGrad)" opacity="0.35" filter="url(#bSoftBlur)"/>
        <circle cx="120" cy="43" r="7.5" fill="url(#bNodeGrad)"/>
        <circle cx="187" cy="81" r="10.5" fill="url(#bNodeGrad)" opacity="0.35" filter="url(#bSoftBlur)"/>
        <circle cx="187" cy="81" r="7.5" fill="url(#bNodeGrad)"/>
        <circle cx="187" cy="159" r="10.5" fill="url(#bNodeGrad2)" opacity="0.35" filter="url(#bSoftBlur)"/>
        <circle cx="187" cy="159" r="7.5" fill="url(#bNodeGrad2)"/>
        <circle cx="120" cy="197" r="10.5" fill="url(#bNodeGrad2)" opacity="0.35" filter="url(#bSoftBlur)"/>
        <circle cx="120" cy="197" r="7.5" fill="url(#bNodeGrad2)"/>
        <circle cx="53" cy="159" r="10.5" fill="url(#bNodeGrad2)" opacity="0.35" filter="url(#bSoftBlur)"/>
        <circle cx="53" cy="159" r="7.5" fill="url(#bNodeGrad2)"/>
        <circle cx="53" cy="81" r="10.5" fill="url(#bNodeGrad)" opacity="0.35" filter="url(#bSoftBlur)"/>
        <circle cx="53" cy="81" r="7.5" fill="url(#bNodeGrad)"/>
      </g>

      <circle cx="120" cy="120" r="34" fill="#22d3ee" opacity="0.34" filter="url(#bStrongBlur)"/>
      <circle cx="120" cy="120" r="23" fill="url(#bCoreGrad)"/>
      <circle cx="120" cy="120" r="23" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>

      <!-- checkmark inside core -->
      <path d="M 110 120 L 117 128 L 132 112" fill="none" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

      <circle cx="113" cy="112" r="6" fill="#ffffff" opacity="0.6" filter="url(#bTinyBlur)"/>
    </g>

    <!-- glass sheen -->
    <ellipse cx="120" cy="10" rx="260" ry="60" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- wordmark -->
  <text x="222" y="103" font-family="'Trebuchet MS', 'DejaVu Sans Condensed', Verdana, sans-serif" font-weight="bold" font-size="44" letter-spacing="0.5"><tspan fill="#f0f9ff">ELYSIUM</tspan><tspan fill="url(#bWordmarkGrad)">-BENCH</tspan></text>

  <text x="223" y="132" font-family="'Trebuchet MS', 'DejaVu Sans Condensed', Verdana, sans-serif" font-weight="bold" font-size="14" letter-spacing="2.6" fill="#7e9cb0">MULTI-DOMAIN SELF-IMPROVEMENT BENCHMARK</text>

  <text x="223" y="160" font-family="'Trebuchet MS', 'DejaVu Sans Condensed', Verdana, sans-serif" font-style="italic" font-size="14.5" letter-spacing="0.5" fill="#67e8f9" opacity="0.85">Does your agent actually get better with practice?</text>

  <!-- divider -->
  <rect x="223" y="112" width="380" height="1" fill="url(#bCyanArc)" opacity="0.28"/>

  <!-- glass panel fill + border -->
  <rect x="6" y="6" width="788" height="188" rx="34" fill="url(#bPanelFill)"/>
  <rect x="6.75" y="6.75" width="786.5" height="186.5" rx="33.25" fill="none" stroke="url(#bPanelStroke)" stroke-width="1.5"/>
</svg>
